  <style>
    .fixed-container {
      position: fixed;
      top: 50%;
      left: 0;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 10px;

      transform: translate(0, -50%);

      width: 20px;
    }

    .fixed-container button{
      padding: 0;
    }

    .fixed-container:hover{
      width: 35px;
      transition: 0.1s;
    }

    .fixed-container button:hover{
      width: 50px;
      padding: 5px;
      transition: 0.1s;
    }
  </style>


 <script>
    document.getElementById('btnTop').addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('btnBottom').addEventListener('click', function() {
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    });

    document.getElementById('btnHideNavFooter').addEventListener('click', function() {
      //utilize a classe hide_element para esconder a navegação de menu
    });

    let scrollLocked = false;
    document.getElementById('btnLockScroll').addEventListener('click', function() {
      if (scrollLocked) {
        document.body.style.overflow = 'auto';
        this.textContent = '🔒';
      } else {
        document.body.style.overflow = 'hidden';
        this.textContent = '🔓';
      }
      scrollLocked = !scrollLocked;
    });

    let menuHidden = false;
    document.getElementById('btnHideNavFooter').addEventListener('click', function() {
      const navFooter = document.getElementById('nav_footer');
      if (menuHidden) {
        navFooter.classList.remove('hide_element');
        this.textContent = '🙉';
      } else {
        navFooter.classList.add('hide_element');
        this.textContent = '🙈';
      }
      menuHidden = !menuHidden;
    });

  </script>

  <style>
    .fixed-bottom {
    box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
}



.tool-item {
    width: 40px;
    height: 40px;
    cursor: pointer;
    padding: 10px;
    color: rgb(255, 255, 255);
    transition: 0.3s;
    border-radius: 4px;
    margin: 0 8px 0 8px;
}

.tool-item.main-icon{
  width: 42px;
  height: 42px;
  background-color: rgb(105, 105, 253);
  border-radius: 50%;;

}

.tool-item:hover{
  transition: 0.3s;
  padding: 5px;
  color: #292929;
  background-color: white;
  border-radius: 4px;
}

.tool-item svg {
    width: 100%;
    height: 100%;
}



.container-alarms {
    scrollbar-width: thin;  /* Para Firefox */
    scrollbar-color: #888 #fff;  /* Para Firefox */
}

.container-alarms::-webkit-scrollbar {
    width: 8px;  /* Para Chrome, Safari e Edge */
}

.container-alarms::-webkit-scrollbar-track {
    background: #f1f1f1; 
}

.container-alarms::-webkit-scrollbar-thumb {
    background: #888; 
    border-radius: 10px;
}

.container-alarms::-webkit-scrollbar-thumb:hover {
    background: #555; 
}

 
.notification-badge {
  position: absolute;
  top: -10px;
  right: -10px;
  background: red;
  color: white;
  border-radius: 50%;
  padding: 5px 10px;
  font-size: 12px;
  display: none; /* Esconder por padrão */
}
 
 
.mark-read-btn {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    /*background-color: #007bff;*/
    color: #fff;
    border: none;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s;
}

.mark-read-btn:hover {
    background-color: #ff0000;
}

.mark-read-btn:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.5);
}
