<!DOCTYPE html> 
<html lang='pt-br'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>E-mail</title>
    <style>
        /* Estilo geral */
        .mail {
            max-width: 900px;
            background-color: #f8f9fa;
            margin: 20px auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            font-family: 'Arial', sans-serif;
        }

        /* Conteúdo principal */
        .mail-content {
            background-color: #ffffff;
            margin: 20px;
            border-radius: 8px;
            padding: 20px;
            min-height: 300px;
            color: #343a40;
            box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.1);
        }

        /* Cabeçalho do e-mail */
        .mail-subject {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Informações do remetente */
        .mail-sender {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .mail-sender img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 16px;
            box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .sender {
            font-size: 16px;
            color: #495057;
        }

        .sender .sender-name {
            font-weight: bold;
        }

        /* Cartão de visita do desenvolvedor */
        .card-profile {
            background-color: #007bff;
            max-width: 600px;
            border-radius: 12px;
            margin: 20px auto;
            padding: 20px;
            text-align: center;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            color: #ffffff;
        }

        .card-profile img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;
            box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.2);
        }

        .card-profile h3 {
            font-size: 22px;
            font-weight: bold;
            margin: 10px 0;
        }

        /* Botões de mídia social */
        .btn-social-media {
            width: 120px;
            height: 40px;
            background-color: #ffffff;
            color: #007bff;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid #007bff;
            display: inline-block; /* Mudado de flex para inline-block */
            text-align: center;
            line-height: 40px; /* Alinha o texto verticalmente */
            box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
        }

        .btn-social-media a {
            text-decoration: none;
            color: inherit; /* Faz o link herdar a cor do botão */
            display: block; /* Garante que o link ocupe toda a área do botão */
        }

        .btn-social-media:hover {
            background-color: #007bff;
            color: #ffffff;
            border-color: #0056b3;
        }

        /* Rodapé */
        .footer {
            background-color: #343a40;
            color: #f8f9fa;
            height: 60px;
            text-align: center;  /* Centraliza o texto do rodapé */
            font-size: 14px;
            font-weight: bold;
            border-radius: 0 0 12px 12px;
            padding-top: 15px;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .mail {
                padding: 15px;
            }

            .mail-subject {
                font-size: 20px;
            }

            .mail-sender {
                flex-direction: column;
                align-items: flex-start;
            }

            .mail-sender img {
                margin-right: 0;
                margin-bottom: 10px;
            }

            .card-profile {
                padding: 15px;
            }

            .btn-social-media {
                width: 100px;
                height: 35px;
            }

            .footer {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .mail {
                padding: 10px;
            }

            .mail-subject {
                font-size: 18px;
            }

            .mail-content {
                padding: 15px;
            }

            .card-profile {
                padding: 10px;
            }

            .footer {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class='mail'>
        <div class='mail-content'>
            <h3 class='mail-subject'>{{subject}}</h3>
            <hr>
            <div class='mail-sender'>
                {{profileImageHTMLUser}}
                <div class='sender'>
                    <label class='sender-name'>{{name}}_</label><br>
                    <label class='sender-mail'>{{email}}</label>
                </div>
            </div>
            <hr>
            <div class='mail-content'>{{bodyContent}}</div>
        </div>
        <div class='card-profile'>
            {{profileImageHTML}}
            <h3>Dione Silva - Desenvolvedor</h3>
            <table align="center">
                <tr>
                    <td>
                        <div class="btn-social-media">
                            <a href="https://chat.whatsapp.com/E7LE4uP8jgu18s196tDcKu" target="_blank">Whatsapp</a>
                        </div>
                    </td>
                </tr>
            </table>
        </div>
        <div class='footer'>
            <h4>© 2025 Silvadevbr. Todos os direitos reservados.</h4>
        </div>
    </div>
</body>
</html>
