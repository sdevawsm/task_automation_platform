<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de HTML</title>
    <style>
        body {
            font-family: Segoe UI, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f3f2f1;
            color: #323130;
        }
        #show_content {
            border: 1px solid #8a8886;
            border-radius: 4px;
            padding: 10px;
            background-color: #ffffff;
            min-height: 100px;
            margin-bottom: 20px;
            overflow-y: auto;
            resize: both;
        }
        #editor {
            width: 100%;
            height: 100px;
            border: 1px solid #8a8886;
            border-radius: 4px;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 10px;
            resize: both;
        }
        button {
            background-color: #0078d4;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
            margin-bottom: 5px;
        }
        button:hover {
            background-color: #005a9e;
        }
    </style>
</head>
<body>
    <h1>Editor de HTML</h1>
    <div contenteditable="true" id="show_content">
        Aqui será exibido como será o resultado final do HTML
    </div>
    <textarea id="editor" placeholder="Adicione o código HTML aqui"></textarea>
    <br>
    <button onclick="document.getElementById('show_content').innerHTML = document.getElementById('editor').value;">
        Mostrar HTML Final
    </button>
    <button onclick="document.getElementById('editor').value = '';">
        Limpar Texto
    </button>
    <button onclick="document.getElementById('show_content').innerHTML = '';">
        Limpar HTML
    </button>
</body>
</html>
